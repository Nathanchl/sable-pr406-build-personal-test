name: Build Sable PR 406

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch PR 406
        run: |
          git fetch https://github.com/ryanhcode/sable.git refs/pull/406/head:pr-406
          git checkout pr-406

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Rust images
        run: ./gradlew sable_rapier:buildImages

      - name: Build Rust natives
        run: ./gradlew sable_rapier:buildRustNatives

      - name: Build Sable
        run: ./gradlew build

      - name: List JAR files
        run: find . -type f -name "*.jar" -not -path "*/.gradle/*" -print

      - name: Upload Sable JAR
        uses: actions/upload-artifact@v4
        with:
          name: sable-pr406
          path: neoforge/build/libs/*.jar
          if-no-files-found: error
